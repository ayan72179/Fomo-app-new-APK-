name: Build Farmo Earn Strict YouTube APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python for Icon
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install pillow

      - name: Install Android Platform 34 & Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Create Structure
        run: |
          mkdir -p app/src/main/java/com/fomo/earn
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Official Farmo HD Icon
        run: |
          python3 - << 'EOF'
          from PIL import Image, ImageDraw

          def generate_icon(size):
              img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              draw.ellipse((0, 0, size, size), fill=(18, 9, 47, 255))
              ring = int(size * 0.05)
              draw.ellipse((ring, ring, size - ring, size - ring), fill=(2, 132, 199, 255))
              pad1 = int(size * 0.09)
              draw.ellipse((pad1, pad1, size - pad1, size - pad1), fill=(12, 5, 31, 255))
              pad2 = int(size * 0.16)
              draw.ellipse((pad2, pad2, size - pad2, size - pad2), fill=(245, 158, 11, 255))
              pad3 = int(size * 0.20)
              draw.ellipse((pad3, pad3, size - pad3, size - pad3), fill=(251, 191, 36, 255))
              pts = [
                  (int(size * 0.42), int(size * 0.35)),
                  (int(size * 0.68), int(size * 0.50)),
                  (int(size * 0.42), int(size * 0.65))
              ]
              draw.polygon(pts, fill=(18, 9, 47, 255))
              return img

          for folder, s in {"mipmap-mdpi":48, "mipmap-hdpi":72, "mipmap-xhdpi":96, "mipmap-xxhdpi":144, "mipmap-xxxhdpi":192}.items():
              generate_icon(s).save(f"app/src/main/res/{folder}/ic_launcher.png")
          
          generate_icon(192).save("app/src/main/res/drawable/ic_logo.png")
          EOF

      - name: Gradle Configs
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FARMO EARN"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }

          android {
              namespace 'com.fomo.earn'
              compileSdk 34

              defaultConfig {
                  applicationId "com.fomo.earn"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

      - name: Layouts and Drawables
        run: |
          cat << 'EOF' > app/src/main/res/drawable/bg_pill_blue.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#E60284C7" />
              <corners android:radius="24dp" />
              <stroke android:color="#38BDF8" android:width="1.5dp" />
          </shape>
          EOF

