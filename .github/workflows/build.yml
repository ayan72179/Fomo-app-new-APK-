          cat << 'EOF' > app/src/main/java/com/fomo/earn/PermissionBottomSheet.java
          package com.fomo.earn;

          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.TextView;
          import androidx.annotation.NonNull;
          import androidx.annotation.Nullable;
          import com.google.android.material.bottomsheet.BottomSheetDialogFragment;

          public class PermissionBottomSheet extends BottomSheetDialogFragment {

              private TextView btn1, btn2, btn3, btn4;
              private Button btnStart;
              private int targetUserId = 1;

              private Handler pollHandler = new Handler(Looper.getMainLooper());
              private Runnable pollRunnable;

              public static PermissionBottomSheet newInstance(int uId) {
                  PermissionBottomSheet fragment = new PermissionBottomSheet();
                  Bundle args = new Bundle();
                  args.putInt("user_id", uId);
                  fragment.setArguments(args);
                  return fragment;
              }

              @Nullable
              @Override
              public View onCreateView(@NonNull LayoutInflater inflater, @Nullable ViewGroup container, @Nullable Bundle savedInstanceState) {
                  return inflater.inflate(R.layout.bottomsheet_permission, container, false);
              }

              @Override
              public void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState) {
                  super.onViewCreated(view, savedInstanceState);

                  if (getArguments() != null) {
                      targetUserId = getArguments().getInt("user_id", 1);
                  }

                  btn1 = view.findViewById(R.id.btn_grant_accessibility);
                  btn2 = view.findViewById(R.id.btn_grant_overlay);
                  btn3 = view.findViewById(R.id.btn_grant_write);
                  btn4 = view.findViewById(R.id.btn_grant_battery);
                  btnStart = view.findViewById(R.id.btn_start_watching);

                  view.findViewById(R.id.btn_close).setOnClickListener(v -> dismiss());

                  btn1.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  btn2.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + requireContext().getPackageName()))));
                  btn3.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:" + requireContext().getPackageName()))));
                  btn4.setOnClickListener(v -> {
                      Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                      intent.setData(Uri.parse("package:" + requireContext().getPackageName()));
                      startActivity(intent);
                  });

                  btnStart.setOnClickListener(v -> {
                      dismiss();
                      AutoWatchService.startEngine(requireContext(), targetUserId);
                      if (MainActivity.instance != null) {
                          MainActivity.instance.syncWatchStateToWeb(true, 15);
                      }
                  });

                  pollRunnable = new Runnable() {
                      @Override
                      public void run() {
                          checkAllGranted();
                          pollHandler.postDelayed(this, 1000);
                      }
                  };
                  pollHandler.post(pollRunnable);
              }

              private void checkAllGranted() {
                  if (getContext() == null) return;

                  boolean a11y = MainActivity.isAccessibilityServiceEnabled(requireContext(), AutoWatchService.class);
                  boolean overlay = Settings.canDrawOverlays(requireContext());
                  boolean write = Settings.System.canWrite(requireContext());
                  PowerManager pm = (PowerManager) requireContext().getSystemService(Context.POWER_SERVICE);
                  boolean battery = pm != null && pm.isIgnoringBatteryOptimizations(requireContext().getPackageName());

                  updateButton(btn1, a11y);
                  updateButton(btn2, overlay);
                  updateButton(btn3, write);
                  updateButton(btn4, battery);

                  if (a11y && overlay && write && battery) {
                      btnStart.setEnabled(true);
                      btnStart.setBackgroundResource(R.drawable.bg_start_enabled);
                      btnStart.setTextColor(Color.WHITE);
                  } else {
                      btnStart.setEnabled(false);
                      btnStart.setBackgroundResource(R.drawable.bg_start_disabled);
                      btnStart.setTextColor(Color.parseColor("#8A8A8A"));
                  }
              }

              private void updateButton(TextView tv, boolean ok) {
                  if (ok) {
                      tv.setText("Granted ✓");
                      tv.setBackgroundResource(R.drawable.bg_granted_green);
                      tv.setTextColor(Color.parseColor("#15803D"));
                  } else {
                      tv.setText("Grant");
                      tv.setBackgroundResource(R.drawable.bg_grant_purple);
                      tv.setTextColor(Color.WHITE);
                  }
              }

              @Override
              public void onDestroyView() {
                  super.onDestroyView();
                  pollHandler.removeCallbacks(pollRunnable);
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/fomo/earn/MainActivity.java
          package com.fomo.earn;

          import android.annotation.SuppressLint;
          import android.content.ComponentName;
          import android.content.Context;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              public static final String APP_URL = "http://zaicash.gamer.gd/index.php?tab=home";
              private WebView webView;
              public static MainActivity instance;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  instance = this;
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.mainWebView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.addJavascriptInterface(new AndroidBridge(this), "AndroidBridge");
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl(APP_URL);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  syncWatchStateToWeb(AutoWatchService.isRunning, AutoWatchService.currentRemainingSeconds);
              }

              public void syncWatchStateToWeb(boolean isRunning, int secondsRemaining) {
                  if (webView == null) return;
                  String js = "if (typeof updateWatchState === 'function') { updateWatchState(" + isRunning + ", " + secondsRemaining + "); }";
                  webView.post(() -> webView.evaluateJavascript(js, null));
              }

              public static boolean isAccessibilityServiceEnabled(Context context, Class<?> service) {
                  ComponentName expectedComponentName = new ComponentName(context, service);
                  String enabledServicesSetting = Settings.Secure.getString(
                          context.getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  );
                  if (enabledServicesSetting == null) return false;
                  TextUtils.SimpleStringSplitter colonSplitter = new TextUtils.SimpleStringSplitter(':');
                  colonSplitter.setString(enabledServicesSetting);
                  while (colonSplitter.hasNext()) {
                      String componentNameString = colonSplitter.next();
                      ComponentName enabledService = ComponentName.unflattenFromString(componentNameString);
                      if (enabledService != null && enabledService.equals(expectedComponentName)) {
                          return true;
                      }
                  }
                  return false;
              }

              public boolean areAllPermissionsGranted() {
                  boolean p1 = isAccessibilityServiceEnabled(this, AutoWatchService.class);
                  boolean p2 = Settings.canDrawOverlays(this);
                  boolean p3 = Settings.System.canWrite(this);
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  boolean p4 = pm != null && pm.isIgnoringBatteryOptimizations(getPackageName());
                  return p1 && p2 && p3 && p4;
              }

              public class AndroidBridge {
                  private final Context context;

                  public AndroidBridge(Context context) {
                      this.context = context;
                  }

                  @JavascriptInterface
                  public void launchAutoWatch(int userId) {
                      runOnUiThread(() -> {
                          if (!areAllPermissionsGranted()) {
                              PermissionBottomSheet sheet = PermissionBottomSheet.newInstance(userId);
                              sheet.show(getSupportFragmentManager(), "perm_sheet");
                              return;
                          }

                          AutoWatchService.startEngine(context, userId);
                          syncWatchStateToWeb(true, 15);
                      });
                  }

                  @JavascriptInterface
                  public void stopAutoWatch() {
                      runOnUiThread(() -> {
                          AutoWatchService.stopEngine();
                          syncWatchStateToWeb(false, 0);
                      });
                  }
              }
          }
